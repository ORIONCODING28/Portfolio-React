    <script>
      try {
        document.documentElement.classList.toggle('dark', localStorage.getItem('portfolio_theme') !== 'light');
      } catch (_) {}
      const route = new URLSearchParams(location.search).get('__route');
      if (route && route.startsWith('/') && !route.startsWith('//')) {
        try {
          const target = new URL(route, location.origin);
          if (target.origin === location.origin && target.pathname.startsWith('%BASE_URL%')) history.replaceState(null, '', target.pathname + target.search + target.hash);
        } catch (_) {}
      }
    </script>
